<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joy Scanner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
  
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --primary: #1d4ed8;
    --primary-light: #eff6ff;
    --accent: #10b981;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  
  /* Header */
  .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; background: var(--card); }
  .header h1 { font-size: 16px; font-weight: 700; color: #0f172a; letter-spacing: 0.5px; }
  .icon-btn { background: none; border: none; font-size: 24px; color: var(--text-main); cursor: pointer; }
  
  /* Main Content Area */
  .main-content { flex: 1; overflow-y: auto; padding: 0 20px 100px; display: flex; flex-direction: column; align-items: center; }
  
  /* Camera/Image Stage */
  .stage-container { position: relative; width: 100%; max-width: 400px; aspect-ratio: 4/5; background: #d1d5db; border-radius: 20px; margin-top: 10px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
  .stage-container canvas { width: 100%; height: 100%; object-fit: cover; }
  .empty-state { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
  
  /* Scanning Overlay Overlay */
  .scan-overlay { position: absolute; inset: 20px; border: 3px solid rgba(16, 185, 129, 0.5); border-radius: 12px; pointer-events: none; }
  .scan-overlay::before, .scan-overlay::after { content: ''; position: absolute; width: 30px; height: 30px; border-color: var(--accent); border-style: solid; }
  .scan-overlay::before { top: -3px; left: -3px; border-width: 3px 0 0 3px; border-radius: 12px 0 0 0; }
  .scan-overlay::after { bottom: -3px; right: -3px; border-width: 0 3px 3px 0; border-radius: 0 0 12px 0; }
  
  /* Top Overlays on Stage */
  .stage-tools { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; color: white; text-shadow: 0 1px 3px rgba(0,0,0,0.5); font-size: 20px; }
  
  /* Status Text */
  .status-section { text-align: center; margin-top: 20px; }
  .status-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .progress-bar { width: 120px; height: 4px; background: #e2e8f0; margin: 0 auto 12px; border-radius: 2px; overflow: hidden; }
  .progress-fill { width: 50%; height: 100%; background: var(--primary); }
  .status-subtitle { font-size: 13px; color: var(--text-muted); }
  
  /* Action Controls */
  .controls-row { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 320px; margin: 30px auto; }
  .control-item { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: var(--text-main); font-weight: 600; background: none; border: none; cursor: pointer; }
  .control-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .scan-btn-large { width: 72px; height: 72px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; border: 4px solid var(--primary-light); box-shadow: 0 8px 16px rgba(29, 78, 216, 0.3); }
  
  /* Tabs */
  .tabs { display: flex; gap: 10px; width: 100%; overflow-x: auto; padding: 10px 0; margin-bottom: 20px; scrollbar-width: none; }
  .tab-btn { padding: 8px 16px; border-radius: 20px; border: none; background: transparent; color: var(--text-muted); font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  .tab-btn.active { background: var(--primary); color: white; }
  
  /* Bottom Nav */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: var(--card); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #e2e8f0; border-radius: 24px 24px 0 0; box-shadow: 0 -4px 10px rgba(0,0,0,0.02); }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--text-muted); text-decoration: none; border: none; background: none; }
  .nav-item.active { color: var(--primary); }
  .nav-icon { font-size: 20px; }
  
  /* Hidden Inputs and Adjustments section */
  input[type=file] { display: none; }
  .adjustments { width: 100%; max-width: 400px; background: var(--card); padding: 16px; border-radius: 16px; margin-top: 20px; display: none; }
  .adjustments.show { display: block; }
  label.s { display: block; font-size: 13px; margin: 10px 0 4px; color: var(--text-muted); font-weight: 600; }
  label.s b { float: right; color: var(--text-main); }
  input[type=range] { width: 100%; accent-color: var(--primary); margin-bottom: 10px; }
  select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 10px; }
</style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <button class="icon-btn">☰</button>
    <h1>IMAGE SCANNER</h1>
    <button class="icon-btn">⚙️</button>
  </header>

  <!-- Main Workspace -->
  <main class="main-content">
    
    <!-- Camera Viewport -->
    <div class="stage-container" id="stage">
      <div class="empty-state" id="empty">No Image</div>
      <canvas id="view" hidden></canvas>
      <canvas id="orig" hidden></canvas>
      
      <!-- Overlay matching reference -->
      <div class="scan-overlay"></div>
      <div class="stage-tools">
        <span>⚡ Auto</span>
        <span>🔍</span>
        <span>⛌</span>
      </div>
    </div>

    <!-- Status -->
    <div class="status-section">
      <div class="status-title" id="status">Scanning Document...</div>
      <div class="progress-bar"><div class="progress-fill"></div></div>
      <div class="status-subtitle">Place document inside the frame.</div>
    </div>

    <!-- Action Buttons -->
    <div class="controls-row">
      <button class="control-item" id="galBtn">
        <div class="control-icon">🖼️</div>
        <span>Gallery</span>
      </button>
      
      <button class="control-item" id="camBtn" style="border:none; background:none;">
        <div class="scan-btn-large">📷</div>
        <span style="margin-top: 8px;">Scan</span>
      </button>

      <button class="control-item" onclick="document.getElementById('adjPanel').classList.toggle('show')">
        <div class="control-icon">🎛️</div>
        <span>Adjust</span>
      </button>
    </div>

    <!-- Mode Tabs -->
    <div class="tabs" id="modes">
      <button class="tab-btn active" data-m="color">Color</button>
      <button class="tab-btn" data-m="gray">Enhance (Gray)</button>
      <button class="tab-btn" data-m="bw">B&W</button>
    </div>

    <!-- Sliders / Adjustments (Collapsible) -->
    <div class="adjustments" id="adjPanel">
      <label class="s">Noise Reduction <b id="dnV">50</b></label>
      <input type="range" id="dn" min="0" max="1" step="0.05" value="0.5">
      
      <label class="s">Contrast <b id="ctV">60</b></label>
      <input type="range" id="ct" min="0" max="1.5" step="0.05" value="0.6">
      
      <label class="s">Sharpness <b id="shV">50</b></label>
      <input type="range" id="sh" min="0" max="1.5" step="0.05" value="0.5">
      
      <label class="s">Resolution</label>
      <select id="q">
        <option value="1400">Low (Fast)</option>
        <option value="2000" selected>Standard</option>
        <option value="2800">High</option>
      </select>
      <div style="display:flex; gap:10px; margin-top:10px;">
        <button id="cmpBtn" style="flex:1; padding:10px; border-radius:8px; border:1px solid #e2e8f0; background:white;">👁️ Compare</button>
        <button id="jpgBtn" style="flex:1; padding:10px; border-radius:8px; border:none; background:var(--primary); color:white;">⬇️ JPG</button>
        <button id="pdfBtn" style="flex:1; padding:10px; border-radius:8px; border:none; background:var(--primary); color:white;">📄 PDF</button>
      </div>
    </div>

  </main>

  <!-- Hidden Inputs -->
  <input type="file" id="camInput" accept="image/*" capture="environment">
  <input type="file" id="galInput" accept="image/*">

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-item active">
      <span class="nav-icon">🏠</span>
      <span>Home</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">📄</span>
      <span>Scans</span>
    </button>
    <button class="nav-item" id="shareBtn">
      <span class="nav-icon">🔗</span>
      <span>Share</span>
    </button>
    <button class="nav-item">
      <span class="nav-icon">👤</span>
      <span>Profile</span>
    </button>
  </nav>

  <!-- আপনার আগের <script> অংশটি হুবহু এখানে বসিয়ে দিন -->
  <script>
    // Paste your existing JavaScript logic here exactly as it was in index.html
  </script>
</body>
</html>
